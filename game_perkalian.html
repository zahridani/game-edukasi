<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>Game Perkalian</title>

<style>

/* =========================
   DASAR
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#ff8c00,#0066ff);
    color:white;
    overflow-x:hidden;
    touch-action:manipulation;
}


/* =========================
   HALAMAN
========================= */

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:min(1150px,100%);
    background:rgba(255,255,255,.97);
    color:#172033;
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    text-align:center;
}


/* =========================
   JUDUL
========================= */

.game-title{
    font-family:"Arial Black",Impact,Arial,sans-serif;
    font-size:clamp(32px,5vw,52px);
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#2563eb;

    text-shadow:
        3px 3px 0 #f59e0b,
        5px 5px 0 rgba(0,0,0,.15);

    margin:0 0 20px;
}


/* =========================
   TOMBOL MASUK
========================= */

.btn-masuk{
    border:0;
    padding:18px 60px;
    min-height:60px;

    font-size:24px;
    font-weight:bold;

    border-radius:14px;
    cursor:pointer;

    background:#2563eb;
    color:white;

    box-shadow:
        0 6px 15px rgba(37,99,235,.35);
}

.btn-masuk:active{
    transform:scale(.96);
}

#gamePage{
    display:none;
}


/* =========================
   FORM SOAL
========================= */

.forms{
    display:flex;
    gap:8px;

    justify-content:center;
    align-items:flex-start;

    margin:8px 0 12px;

    width:100%;
}

.input-box,
.answer-box{
    width:190px;
    flex:1 1 150px;
    max-width:220px;
}

.input-box label,
.answer-box label{
    display:block;

    font-weight:bold;

    margin-bottom:6px;

    font-size:17px;
}

.input-box input,
.answer-box input{
    width:100%;
    height:62px;

    text-align:center;

    font-size:30px;
    font-weight:bold;

    border:3px solid #cbd5e1;
    border-radius:12px;

    background:#f8fafc;
    color:#172033;
}

.answer-box input{
    border-color:#f59e0b;
    background:#fffbeb;
}


/* =========================
   TANDA X DAN =
========================= */

.operator{
    display:flex;

    align-items:center;
    justify-content:center;

    font-size:38px;
    font-weight:900;

    color:#2563eb;

    padding-top:35px;

    min-width:32px;
}

.equals{
    color:#f59e0b;
}


/* =========================
   RESET ANGKA
========================= */

.reset-number-btn{
    width:100%;

    min-height:40px;

    margin-top:7px;

    padding:7px 8px;

    border:0;
    border-radius:9px;

    background:#64748b;
    color:white;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}


/* =========================
   CEK JAWABAN
========================= */

.answer-btn{
    width:100%;

    min-height:50px;

    margin-top:7px;

    padding:10px;

    border:0;
    border-radius:10px;

    background:#f59e0b;
    color:white;

    font-weight:bold;
    font-size:17px;

    cursor:pointer;
}


/* =========================
   RESET GAME
========================= */

.reset-game-row{
    margin:5px 0 8px;
}

.reset-game{
    min-height:46px;

    padding:9px 30px;

    border:0;
    border-radius:9px;

    background:#64748b;
    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

.reset-number-btn:active,
.reset-game:active,
.answer-btn:active{
    transform:scale(.96);
}


/* =========================
   HASIL BENAR / SALAH
========================= */

.feedback{
    min-height:58px;

    font-size:clamp(24px,4vw,38px);

    font-weight:900;

    margin:5px 0 12px;

    font-family:"Arial Black",Impact,Arial,sans-serif;

    letter-spacing:1px;

    text-transform:uppercase;

    transition:transform .25s ease;
}

.feedback.show{
    transform:scale(1.06);
}


/* =========================
   3 KOTAK GAME
========================= */

.boxes{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;

    margin-top:8px;
}


/* =========================
   KOTAK ANGKA
========================= */

.number-box{
    border:3px solid #2563eb;

    border-radius:18px;

    padding:15px;

    background:#eff6ff;
}

.number-box.b{
    border-color:#16a34a;
    background:#f0fdf4;
}

.number-box.answer{
    border-color:#f59e0b;
    background:#fffbeb;
}

.number-box h2{
    margin:0 0 12px;

    font-size:
        clamp(16px,2.2vw,22px);
}


/* =========================
   GRID ANGKA
========================= */

.number-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.number-btn{
    width:100%;

    min-height:62px;

    border:0;

    border-radius:11px;

    background:#2563eb;

    color:white;

    font-size:26px;
    font-weight:bold;

    cursor:pointer;

    touch-action:manipulation;
    user-select:none;
}

.number-box.b .number-btn{
    background:#16a34a;
}

.number-box.answer .number-btn{
    background:#f59e0b;
}

.number-btn:active{
    transform:scale(.92);

    filter:brightness(.85);
}


/* tombol 0 di tengah */

.zero-button{
    grid-column:2;
}


/* =========================
   TABLET / PID
========================= */

@media(min-width:651px)
and (max-width:1200px){

    .card{
        max-width:1100px;
        padding:24px;
    }

    .number-btn{
        min-height:68px;
        font-size:29px;
    }
}


/* ==================================================
   HP / LAYAR KECIL
================================================== */

@media(max-width:650px){

    body{
        overflow-y:auto;
    }

    .page{
        align-items:flex-start;

        padding:8px;
    }

    .card{
        padding:14px;

        border-radius:16px;
    }


    /* JUDUL HP */

    .game-title{
        font-size:28px;

        letter-spacing:1px;

        margin-bottom:14px;
    }


    .card > p{
        margin:7px 0 14px;

        font-size:14px;
    }


    .btn-masuk{
        padding:14px 42px;

        min-height:52px;

        font-size:21px;
    }


    /* FORM DI HP */

    .forms{
        display:grid;

        grid-template-columns:
            minmax(0,1fr)
            28px
            minmax(0,1fr);

        gap:5px;

        align-items:start;

        margin:5px 0 8px;
    }


    .input-box{
        width:auto;

        max-width:none;

        min-width:0;
    }


    /* JAWABAN DI BARIS SENDIRI */

    .answer-box{
        width:auto;

        max-width:none;

        grid-column:1 / -1;

        margin-top:3px;
    }


    .input-box label,
    .answer-box label{
        font-size:13px;

        margin-bottom:4px;
    }


    .input-box input,
    .answer-box input{

        height:52px;

        font-size:25px;

        border-width:2px;
    }


    /* TANDA X */

    .operator{

        font-size:28px;

        min-width:0;

        padding-top:29px;
    }


    /* TANDA = */

    .equals{
        display:none;
    }


    /* = di atas jawaban */

    .answer-box:before{

        content:"=";

        display:block;

        font-size:25px;

        font-weight:900;

        color:#f59e0b;

        margin-bottom:2px;
    }


    /* RESET KECIL */

    .reset-number-btn{

        min-height:34px;

        margin-top:5px;

        padding:5px 4px;

        font-size:10px;
    }


    /* CEK */

    .answer-btn{

        min-height:46px;

        font-size:15px;

        margin-top:5px;
    }


    /* RESET GAME */

    .reset-game{

        min-height:42px;

        font-size:14px;

        padding:8px 24px;
    }


    /* FEEDBACK */

    .feedback{

        min-height:50px;

        font-size:23px;

        margin:3px 0 8px;
    }


    /* KOTAK ANGKA */

    .boxes{

        grid-template-columns:1fr;

        gap:10px;

        margin-top:5px;
    }


    .number-box{

        padding:10px;

        border-width:2px;

        border-radius:14px;
    }


    .number-box h2{

        font-size:17px;

        margin-bottom:9px;
    }


    .number-grid{

        gap:6px;
    }


    .number-btn{

        min-height:55px;

        font-size:25px;

        border-radius:9px;
    }

}


/* ==================================================
   HP SANGAT KECIL
================================================== */

@media(max-width:380px){

    .card{
        padding:10px;
    }

    .game-title{
        font-size:24px;
    }

    .forms{

        grid-template-columns:
            minmax(0,1fr)
            24px
            minmax(0,1fr);
    }

    .input-box input,
    .answer-box input{

        height:48px;

        font-size:22px;
    }

    .operator{

        font-size:25px;

        padding-top:27px;
    }

    .number-btn{

        min-height:50px;

        font-size:23px;
    }

    .number-box h2{

        font-size:15px;
    }

    .feedback{

        font-size:20px;
    }

}

</style>
</head>


<body>


<!-- ==================================================
     HALAMAN AWAL
================================================== -->

<div id="homePage" class="page">

    <div class="card">

        <h1 class="game-title">
            🏆 GAME PERKALIAN 🏆
        </h1>

        <p>
            Klik tombol di bawah untuk memulai permainan.
        </p>

        <button
            class="btn-masuk"
            onclick="masukGame()">

            🚀 MASUK

        </button>

    </div>

</div>



<!-- ==================================================
     HALAMAN GAME
================================================== -->

<div id="gamePage" class="page">

<div class="card">


<h1 class="game-title">
    🏆 GAME PERKALIAN 🏆
</h1>



<!-- FORM SOAL -->

<div class="forms">


    <!-- ANGKA PERTAMA -->

    <div class="input-box">

        <label>
            ANGKA PERTAMA
        </label>

        <input
            id="formA"
            type="text"
            readonly
            placeholder="Kosong">

        <button
            class="reset-number-btn"
            onclick="resetA()">

            RESET ANGKA PERTAMA

        </button>

    </div>



    <!-- X -->

    <div class="operator">

        ×

    </div>



    <!-- ANGKA KEDUA -->

    <div class="input-box">

        <label>
            ANGKA KEDUA
        </label>

        <input
            id="formB"
            type="text"
            readonly
            placeholder="Kosong">

        <button
            class="reset-number-btn"
            onclick="resetB()">

            RESET ANGKA KEDUA

        </button>

    </div>



    <!-- = -->

    <div class="operator equals">

        =

    </div>



    <!-- JAWABAN -->

    <div class="answer-box">

        <label>
            JAWABAN
        </label>

        <input
            id="hasil"
            type="text"
            readonly
            placeholder="Pilih jawaban">

        <button
            class="reset-number-btn"
            onclick="resetHasil()">

            RESET JAWABAN

        </button>

    </div>

</div>



<!-- CEK JAWABAN -->

<button
    class="answer-btn"
    onclick="jawab()">

    CEK JAWABAN

</button>



<!-- RESET GAME -->

<div class="reset-game-row">

    <button
        class="reset-game"
        onclick="resetGame()">

        RESET GAME

    </button>

</div>



<!-- FEEDBACK -->

<div
    id="feedback"
    class="feedback">
</div>



<!-- ==================================================
     PILIHAN ANGKA
================================================== -->

<div class="boxes">


<!-- ==================================================
     KOTAK A
================================================== -->

<div class="number-box">

    <h2>
        🔵 PILIH ANGKA PERTAMA
    </h2>

    <div class="number-grid">

        <button
            class="number-btn"
            onclick="pilihA(1)">
            1
        </button>

        <button
            class="number-btn"
            onclick="pilihA(2)">
            2
        </button>

        <button
            class="number-btn"
            onclick="pilihA(3)">
            3
        </button>

        <button
            class="number-btn"
            onclick="pilihA(4)">
            4
        </button>

        <button
            class="number-btn"
            onclick="pilihA(5)">
            5
        </button>

        <button
            class="number-btn"
            onclick="pilihA(6)">
            6
        </button>

        <button
            class="number-btn"
            onclick="pilihA(7)">
            7
        </button>

        <button
            class="number-btn"
            onclick="pilihA(8)">
            8
        </button>

        <button
            class="number-btn"
            onclick="pilihA(9)">
            9
        </button>

        <button
            class="number-btn zero-button"
            onclick="pilihA(0)">
            0
        </button>

    </div>

</div>



<!-- ==================================================
     KOTAK B
================================================== -->

<div class="number-box b">

    <h2>
        🟢 PILIH ANGKA KEDUA
    </h2>

    <div class="number-grid">

        <button
            class="number-btn"
            onclick="pilihB(1)">
            1
        </button>

        <button
            class="number-btn"
            onclick="pilihB(2)">
            2
        </button>

        <button
            class="number-btn"
            onclick="pilihB(3)">
            3
        </button>

        <button
            class="number-btn"
            onclick="pilihB(4)">
            4
        </button>

        <button
            class="number-btn"
            onclick="pilihB(5)">
            5
        </button>

        <button
            class="number-btn"
            onclick="pilihB(6)">
            6
        </button>

        <button
            class="number-btn"
            onclick="pilihB(7)">
            7
        </button>

        <button
            class="number-btn"
            onclick="pilihB(8)">
            8
        </button>

        <button
            class="number-btn"
            onclick="pilihB(9)">
            9
        </button>

        <button
            class="number-btn zero-button"
            onclick="pilihB(0)">
            0
        </button>

    </div>

</div>



<!-- ==================================================
     KOTAK JAWABAN
================================================== -->

<div class="number-box answer">

    <h2>
        🟠 PILIH JAWABAN
    </h2>

    <div class="number-grid">

        <button
            class="number-btn"
            onclick="pilihHasil(1)">
            1
        </button>

        <button
            class="number-btn"
            onclick="pilihHasil(2)">
            2
        </button>

        <button
            class="number-btn"
            onclick="pilihHasil(3)">
            3
        </button>

        <button
            class="number-btn"
            onclick="pilihHasil(4)">
            4
        </button>

        <button
            class="number-btn"
            onclick="pilihHasil(5)">
            5
        </button>

        <button
            class="number-btn"
            onclick="pilihHasil(6)">
            6
        </button>

        <button
            class="number-btn"
            onclick="pilihHasil(7)">
            7
        </button>

        <button
            class="number-btn"
            onclick="pilihHasil(8)">
            8
        </button>

        <button
            class="number-btn"
            onclick="pilihHasil(9)">
            9
        </button>

        <button
            class="number-btn zero-button"
            onclick="pilihHasil(0)">
            0
        </button>

    </div>

</div>


</div>

</div>

</div>



<script>

/* ==================================================
   MASUK GAME
================================================== */

function masukGame(){

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("gamePage")
        .style.display = "flex";
}



/* ==================================================
   PILIH ANGKA A
================================================== */

function pilihA(angka){

    const form =
        document.getElementById("formA");

    if(form.value.length < 2){

        form.value += angka;

    }

}



/* ==================================================
   PILIH ANGKA B
================================================== */

function pilihB(angka){

    const form =
        document.getElementById("formB");

    if(form.value.length < 2){

        form.value += angka;

    }

}



/* ==================================================
   PILIH JAWABAN
================================================== */

function pilihHasil(angka){

    const form =
        document.getElementById("hasil");

    if(form.value.length < 4){

        form.value += angka;

    }

}



/* ==================================================
   RESET A
================================================== */

function resetA(){

    document.getElementById("formA")
        .value = "";

}



/* ==================================================
   RESET B
================================================== */

function resetB(){

    document.getElementById("formB")
        .value = "";

}



/* ==================================================
   RESET JAWABAN
================================================== */

function resetHasil(){

    document.getElementById("hasil")
        .value = "";

}



/* ==================================================
   CEK JAWABAN
================================================== */

function jawab(){

    const a =
        document.getElementById("formA").value;

    const b =
        document.getElementById("formB").value;

    const hasil =
        document.getElementById("hasil").value;

    const feedback =
        document.getElementById("feedback");


    feedback.classList.remove("show");


    /* BELUM PILIH ANGKA */

    if(a === "" || b === ""){

        feedback.textContent =
            "🔢 PILIH KEDUA ANGKA DULU!";

        feedback.style.color =
            "#f59e0b";

    }


    /* BELUM PILIH JAWABAN */

    else if(hasil === ""){

        feedback.textContent =
            "🤔 PILIH JAWABANNYA DULU!";

        feedback.style.color =
            "#f59e0b";

    }


    /* BENAR */

    else if(
        Number(hasil) ===
        Number(a) * Number(b)
    ){

        feedback.textContent =
            "🎉 JAWABAN BENAR! HEBAT! 🏆";

        feedback.style.color =
            "#16a34a";

    }


    /* SALAH */

    else{

        feedback.textContent =
            "😅 JAWABAN SALAH! COBA LAGI! 🌟";

        feedback.style.color =
            "#dc2626";

    }


    setTimeout(function(){

        feedback.classList.add("show");

    },20);

}



/* ==================================================
   RESET GAME
================================================== */

function resetGame(){

    document.getElementById("formA")
        .value = "";

    document.getElementById("formB")
        .value = "";

    document.getElementById("hasil")
        .value = "";

    const feedback =
        document.getElementById("feedback");

    feedback.textContent = "";

    feedback.classList.remove("show");

}

</script>

</body>
</html>
